<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sin - AI Prompt editor</title><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="ribbon.css"><link rel="stylesheet" href="color-picker.css"></head>
<body>
<div id="toolbar" role="toolbar" aria-label="Rich Text Formatting"></div>
<div id="notice" hidden role="alert"></div>
<iframe id="document" title="HTML Document" sandbox="allow-same-origin"></iframe>
<script>
addEventListener('error',event=>window.webkit?.messageHandlers?.sinNative?.postMessage({type:'startup-error',message:event.message||'Editor resource could not load',source:event.filename||event.target?.src||'',line:event.lineno||0}),true);
addEventListener('unhandledrejection',event=>window.webkit?.messageHandlers?.sinNative?.postMessage({type:'startup-error',message:String(event.reason?.stack||event.reason)}));
</script>
<script type="module" src="editor.js"></script>
</body></html>
